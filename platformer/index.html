<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Рыжик</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;700&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  /* layout: portrait = game picture on top, big thumb buttons under it; landscape = picture on the whole screen, buttons over it */
  --bg:#141c24;        /* around the picture and under the buttons */
  --panel:#1f2a36;     /* buttons, cards */
  --panel-hi:#2b3a4a;
  --fox:#f08a24;       /* accent: the hero's colour */
  --text:#eef2f6;
  --muted:#93a1b3;
  --bad:#e0524a;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;
  display:flex;flex-direction:column;overflow:hidden;position:relative;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;
}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:2px solid var(--fox);outline-offset:2px}

#stage{position:relative;flex:none;width:100%;overflow:hidden;background:#000}
#cv{display:block;width:100%;height:100%}
#hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;padding:6px 10px;font-weight:700;font-size:15px;
  text-shadow:0 1px 0 rgba(0,0,0,.55);font-variant-numeric:tabular-nums;pointer-events:none}
#hearts{color:#ff5a5f;letter-spacing:2px;font-size:17px}
#hearts i{font-style:normal;opacity:.3}
#coins::before{content:"";display:inline-block;width:11px;height:11px;border-radius:50%;background:#ffd23f;box-shadow:inset 0 -2px 0 #c9951a;margin-right:5px;vertical-align:-1px}
#time{margin-left:auto}
#bPause{pointer-events:auto;background:rgba(0,0,0,.35);border-radius:8px;width:34px;height:30px;font-size:12px;letter-spacing:1px}

#pad{flex:1;min-height:0;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 18px calc(14px + env(safe-area-inset-bottom));}
#dpad{display:flex;gap:10px;touch-action:none}
.k{width:78px;height:78px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:26px;color:var(--text);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.3),0 2px 6px rgba(0,0,0,.35);touch-action:none}
.k.on{background:var(--panel-hi);transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.3)}
#kj{width:96px;height:96px;background:var(--fox);color:#2b1a12;font-size:32px}
#kj.on{background:#ffa64a}
#padhint{flex:1;text-align:center;color:var(--muted);font-size:12px;line-height:1.35;min-width:0}
body.land #stage{flex:1}
body.land #pad{position:absolute;left:0;right:0;bottom:0;padding:10px 22px calc(12px + env(safe-area-inset-bottom));pointer-events:none}
body.land #pad .k{pointer-events:auto;opacity:.55}
body.land #padhint{display:none}
body.nopad #pad{display:none}
body.nopad #stage{flex:1}

.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px;
  background:rgba(14,20,27,.9);text-align:center;z-index:5}
.ov.show{display:flex}
.ov h1{font-family:var(--display);font-size:34px;margin:0;color:var(--fox);letter-spacing:.02em}
.ov h2{font-family:var(--display);font-size:20px;margin:0}
.ov p{margin:0;color:var(--muted);max-width:320px;line-height:1.4}
.levels{display:flex;flex-direction:column;gap:8px;width:100%;max-width:320px}
.lv{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:12px;padding:12px 14px;text-align:left;width:100%}
.lv b{font-family:var(--display);font-size:18px;color:var(--fox);width:22px}
.lv span{flex:1;font-weight:700}
.lv small{color:var(--muted);font-variant-numeric:tabular-nums}
.lv:disabled{opacity:.45;cursor:default}
.lv:disabled b{color:var(--muted)}
.btn{background:var(--fox);color:#2b1a12;font-weight:700;border-radius:12px;padding:13px 22px;min-width:200px}
.btn.alt{background:var(--panel);color:var(--text)}
.row{display:flex;gap:8px}
.chip{background:var(--panel);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:500}
.stats{display:grid;grid-template-columns:auto auto;gap:6px 18px;font-size:16px;text-align:left}
.stats b{text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hud"><span id="hearts"></span><span id="coins"></span><span id="time"></span><button id="bPause" aria-label="Pause">❚❚</button></div>
</div>
<div id="pad">
  <div id="dpad"><div class="k" id="kl">◀</div><div class="k" id="kr">▶</div></div>
  <div id="padhint"></div>
  <div class="k" id="kj">▲</div>
</div>

<div class="ov show" id="menu">
  <h1 id="tTitle"></h1>
  <p id="tSub"></p>
  <div class="levels" id="levels"></div>
  <div class="row"><button class="chip" id="bSound"></button><button class="chip" id="bLang"></button></div>
</div>
<div class="ov" id="pause">
  <h2 id="tPause"></h2>
  <button class="btn" id="bResume"></button>
  <button class="btn alt" id="bRestart"></button>
  <button class="btn alt" id="bMenu1"></button>
</div>
<div class="ov" id="end">
  <h2 id="tEnd"></h2>
  <div class="stats" id="stats"></div>
  <button class="btn" id="bNext"></button>
  <button class="btn alt" id="bAgain"></button>
  <button class="btn alt" id="bMenu2"></button>
</div>

<script>
'use strict';
//<core>
// Правила и физика. Без экрана и браузера: этот кусок целиком запускается в Node (test/platformer.js).
const Core=(()=>{
const T=16,ROWS=14,GR=12;                 // клетка 16 px, поле 14 клеток в высоту, земля начинается с 12-го ряда
const E=0,GRASS=1,DIRT=2,BRICK=3,BONUS=4,USED=5,STONE=6,SPIKE=7;
const ACC=0.25,MAXV=2.2,FRIC=0.3,GRAV=0.35,JUMP=-6.3,MAXFALL=7;
const solid=t=>t>=1&&t<=6;

// Уровень собирается из кусков. x — колонка, h — высота над землёй в клетках (0 = на земле).
function make(w,theme,fn){
  const grid=new Uint8Array(w*ROWS);
  const L={w,theme,grid,coins:[],enemies:[],checks:[],flag:w-6,hearts:{},total:0};
  const set=(x,r,t)=>{if(x>=0&&x<w&&r>=0&&r<ROWS)grid[r*w+x]=t;};
  const g={
    gap(x,n){for(let i=x;i<x+n;i++){set(i,GR,E);set(i,GR+1,E);}},
    hill(x0,x1,h){for(let x=x0;x<=x1;x++){for(let k=1;k<=h;k++)set(x,GR-k,k===h?GRASS:DIRT);set(x,GR,DIRT);}},
    plat(x,h,n,t){for(let i=0;i<n;i++)set(x+i,GR-h,t||BRICK);},
    bonus(x,h,heart){set(x,GR-h,BONUS);if(heart)L.hearts[(GR-h)*w+x]=1;},
    coins(x,h,n){for(let i=0;i<(n||1);i++)L.coins.push({x:x+i,r:GR-h});},
    arc(x,n){for(let i=0;i<n;i++)L.coins.push({x:x+i,r:GR-(i===0||i===n-1?2:3)});},
    spikes(x,n){for(let i=0;i<n;i++)set(x+i,GR-1,SPIKE);},
    slime(x,h){L.enemies.push({type:'slime',x,h:h||0});},
    spiky(x,h){L.enemies.push({type:'spiky',x,h:h||0});},
    bat(x,h,range){L.enemies.push({type:'bat',x,h,range});},
    check(x){L.checks.push(x);},
    flag(x){L.flag=x;}
  };
  for(let x=0;x<w;x++){set(x,GR,GRASS);set(x,GR+1,DIRT);}
  fn(g);
  let b=0;for(let i=0;i<grid.length;i++)if(grid[i]===BONUS&&!L.hearts[i])b++;
  L.total=L.coins.length+b;
  return L;
}

const LEVELS=[
  make(136,0,g=>{ // Опушка: знакомство
    g.coins(7,2,3);
    g.plat(13,4,1);g.bonus(14,4);g.plat(15,4,1);
    g.slime(21);
    g.hill(25,30,1);g.hill(28,30,2);g.coins(28,4,3);
    g.gap(34,2);g.arc(33,4);
    g.slime(40);g.slime(45);
    g.plat(48,3,4);g.coins(48,4,4);g.bonus(50,6);
    g.gap(55,3);g.arc(54,5);
    g.check(61);
    g.hill(64,65,2);g.slime(69);g.hill(73,74,2);g.bonus(68,4);g.bonus(70,4);
    g.gap(78,2);g.gap(83,2);g.coins(80,2,3);
    g.hill(89,99,1);g.hill(92,99,2);g.hill(95,99,3);g.coins(96,5,3);
    g.slime(104);g.slime(109);
    g.plat(112,3,3);g.coins(112,4,3);g.plat(117,5,3);g.coins(117,6,3);
    g.bonus(123,4);
    g.flag(129);
  }),
  make(160,1,g=>{ // Холмы: ямы, колючки, летучие мыши
    g.coins(6,2,3);g.slime(12);
    g.gap(16,3);g.arc(15,5);
    g.hill(22,24,2);g.spiky(28);
    g.plat(31,3,3);g.coins(31,4,3);g.bonus(32,6);
    g.gap(36,3);g.arc(35,5);g.gap(42,3);g.arc(41,5);
    g.bat(48,3,3);
    g.gap(52,12);g.plat(54,2,2);g.plat(58,3,2);g.plat(61,2,2);g.coins(54,3,2);g.coins(58,4,2);g.coins(61,3,2);
    g.check(67);
    g.slime(71);g.slime(74);g.hill(77,78,2);
    g.bonus(81,4);g.bonus(83,4,true);
    g.spikes(86,2);
    g.hill(89,93,1);g.hill(91,93,3);g.coins(91,5,3);
    g.gap(94,3);
    g.spiky(99);
    g.hill(102,103,1);g.spikes(105,12);g.plat(104,3,3);g.plat(109,5,3);g.plat(114,3,3);g.coins(104,4,3);g.coins(109,6,3);g.coins(114,4,3);
    g.bat(121,3,3);
    g.gap(125,3);g.arc(124,5);
    g.slime(132);g.slime(136);g.hill(139,140,2);
    g.hill(144,150,1);g.hill(146,150,2);g.hill(148,150,3);g.coins(148,5,3);
    g.flag(154);
  }),
  make(186,2,g=>{ // Сумерки: всё сразу
    g.coins(6,2,2);g.spiky(10);
    g.gap(14,3);g.arc(13,5);
    g.hill(19,20,2);g.slime(23);g.slime(26);g.hill(29,30,2);g.bonus(24,4);g.bonus(25,4);
    g.gap(33,3);g.arc(32,5);
    g.bat(40,3,3);g.spikes(43,2);
    g.plat(47,3,2);g.plat(51,5,2);g.plat(55,7,2);g.coins(47,4,2);g.coins(51,6,2);g.bonus(56,10,true);
    g.check(62);
    g.gap(65,16);g.plat(67,2,2);g.plat(71,3,2);g.plat(75,4,2);g.plat(79,3,2);
    g.coins(67,3,2);g.coins(71,4,2);g.coins(75,5,2);g.coins(79,4,2);g.bat(73,7,3);
    g.spiky(85);g.spiky(89);
    g.hill(92,96,1);g.hill(94,96,3);g.coins(94,5,3);g.spikes(97,3);
    g.slime(103);g.bonus(104,4);
    g.gap(108,3);g.gap(113,3);g.arc(107,5);g.arc(112,5);
    g.check(117);
    g.hill(119,120,1);g.spikes(121,5);g.plat(121,3,5);g.coins(121,4,5);
    g.slime(129);g.bat(133,3,3);
    g.gap(137,10);g.plat(139,2,1);g.plat(142,3,1);g.plat(145,2,1);g.coins(139,3,1);g.coins(142,4,1);g.coins(145,3,1);
    g.bonus(149,4,true);
    g.spiky(152);g.slime(156);g.hill(159,160,2);
    g.spikes(163,2);g.spikes(167,2);
    g.hill(171,177,1);g.hill(173,177,2);g.hill(175,177,3);g.coins(175,5,3);
    g.flag(181);
  })
];

function start(i){
  const L=LEVELS[i];
  return {i,w:L.w,theme:L.theme,grid:L.grid.slice(),heartsAt:L.hearts,
    coins:L.coins.map(c=>({x:c.x*T+3,y:c.r*T+3,got:false})),
    en:L.enemies.map(e=>{
      const o={type:e.type,w:12,h:e.type==='bat'?8:10,vx:-1,vy:0,dead:0,t:0,awake:false};
      o.x=e.x*T+2;o.y=(GR-e.h)*T-o.h;o.bx=o.x;o.by=o.y;o.range=(e.range||3)*T;return o;}),
    checks:L.checks.map(x=>({x,on:false})),flag:L.flag,
    p:{x:2*T,y:GR*T-14,vx:0,vy:0,w:10,h:14,ground:true,dir:1,inv:0,coyote:0,jbuf:0,held:false,cut:false,anim:0},
    spawn:{x:2*T,y:GR*T-14},hearts:3,score:0,got:0,total:L.total,time:0,status:'play',ev:[],fx:[]};
}
function tile(s,c,r){if(c<0||c>=s.w)return STONE;if(r<0||r>=ROWS)return E;return s.grid[r*s.w+c];}
function moveX(s,e,dx){
  e.x+=dx;const top=Math.floor(e.y/T),bot=Math.floor((e.y+e.h-0.01)/T);
  if(dx>0){const c=Math.floor((e.x+e.w-0.01)/T);for(let r=top;r<=bot;r++)if(solid(tile(s,c,r))){e.x=c*T-e.w;return true;}}
  else if(dx<0){const c=Math.floor(e.x/T);for(let r=top;r<=bot;r++)if(solid(tile(s,c,r))){e.x=(c+1)*T;return true;}}
  return false;
}
function moveY(s,e,dy){
  e.y+=dy;const l=Math.floor(e.x/T),rt=Math.floor((e.x+e.w-0.01)/T);
  if(dy>0){const r=Math.floor((e.y+e.h-0.01)/T);for(let c=l;c<=rt;c++)if(solid(tile(s,c,r))){e.y=r*T-e.h;return 1;}}
  else if(dy<0){const r=Math.floor(e.y/T);for(let c=l;c<=rt;c++)if(solid(tile(s,c,r))){e.y=(r+1)*T;return -1;}}
  return 0;
}
function hurt(s,fromX){
  const p=s.p;if(p.inv>0||s.status!=='play')return;
  s.hearts--;p.inv=100;p.vy=-3.5;p.vx=(p.x+p.w/2<fromX?-1:1)*2.2;p.cut=false;s.ev.push('hurt');
  if(s.hearts<=0){s.status='dead';s.ev.push('dead');}
}
function headHit(s){
  const p=s.p,r=Math.round(p.y/T)-1;
  let c=Math.floor((p.x+p.w/2)/T);
  if(!solid(tile(s,c,r))){c=Math.floor(p.x/T);if(!solid(tile(s,c,r)))c=Math.floor((p.x+p.w-0.01)/T);}
  const t=tile(s,c,r);if(c<0||c>=s.w||r<0)return;
  if(t===BONUS){
    const idx=r*s.w+c;s.grid[idx]=USED;s.fx.push({k:'bump',c,r,t:0});
    if(s.heartsAt[idx]){
      if(s.hearts<3)s.hearts++;else s.score+=30;
      s.ev.push('heart');s.fx.push({k:'heart',x:c*T+4,y:r*T-10,t:0});
    }else{s.got++;s.score+=10;s.ev.push('coin');s.fx.push({k:'coin',x:c*T+4,y:r*T-10,t:0});}
  }else if(t===BRICK){s.fx.push({k:'bump',c,r,t:0});s.ev.push('bump');}
}
// Один шаг игры (1/60 с). inp: {left,right,jump}
function step(s,inp){
  s.ev.length=0;if(s.status!=='play')return;
  s.time++;const p=s.p;
  if(inp.left&&!inp.right){p.vx=Math.max(p.vx-ACC,-MAXV);p.dir=-1;}
  else if(inp.right&&!inp.left){p.vx=Math.min(p.vx+ACC,MAXV);p.dir=1;}
  else p.vx=Math.abs(p.vx)<FRIC?0:p.vx-Math.sign(p.vx)*FRIC;
  if(inp.jump&&!p.held)p.jbuf=7;                    // нажали чуть раньше приземления — прыжок всё равно сработает
  p.held=!!inp.jump;if(p.jbuf>0)p.jbuf--;
  p.coyote=p.ground?6:Math.max(0,p.coyote-1);       // и чуть позже края платформы — тоже
  if(p.jbuf>0&&p.coyote>0){p.vy=JUMP;p.jbuf=0;p.coyote=0;p.cut=true;s.ev.push('jump');}
  if(p.cut&&!inp.jump&&p.vy<-2.6)p.vy=-2.6;         // отпустили кнопку — прыжок ниже
  if(p.vy>=0)p.cut=false;
  p.vy=Math.min(p.vy+GRAV,MAXFALL);
  if(moveX(s,p,p.vx))p.vx=0;
  const hy=moveY(s,p,p.vy);p.ground=false;
  if(hy>0){p.ground=true;p.vy=0;}else if(hy<0){p.vy=0;headHit(s);}
  p.anim+=Math.abs(p.vx);if(p.inv>0)p.inv--;

  for(const e of s.en){
    if(e.dead){e.dead++;continue;}
    if(!e.awake){if(Math.abs(e.x-p.x)<300)e.awake=true;else continue;}
    e.t++;
    if(e.type==='bat'){e.x=e.bx+Math.sin(e.t*0.025)*e.range;e.y=e.by+Math.sin(e.t*0.09)*5;}
    else{
      e.vy=Math.min(e.vy+GRAV,MAXFALL);
      if(moveX(s,e,e.vx*(e.type==='slime'?0.5:0.35)))e.vx=-e.vx;
      const ey=moveY(s,e,e.vy);
      if(ey>0){e.vy=0;const fx=e.vx>0?e.x+e.w+1:e.x-1;
        if(!solid(tile(s,Math.floor(fx/T),Math.floor((e.y+e.h+1)/T))))e.vx=-e.vx;}   // у края разворачивается
      if(e.y>ROWS*T+40){e.dead=100;continue;}
    }
    if(p.x<e.x+e.w&&p.x+p.w>e.x&&p.y<e.y+e.h&&p.y+p.h>e.y){
      if(e.type!=='spiky'&&p.vy>0&&p.y+p.h-p.vy<=e.y+e.h*0.6){
        e.dead=1;p.vy=inp.jump?JUMP:-4.2;p.cut=!!inp.jump;s.score+=50;s.ev.push('stomp');s.fx.push({k:'puff',x:e.x+e.w/2,y:e.y+e.h/2,t:0});
      }else hurt(s,e.x+e.w/2);
    }
  }
  // шипы
  {const r=Math.floor((p.y+p.h-1)/T);
   for(let c=Math.floor((p.x+2)/T);c<=Math.floor((p.x+p.w-2)/T);c++)if(tile(s,c,r)===SPIKE&&p.y+p.h>r*T+7)hurt(s,c*T+8);}
  // яма
  if(p.y>ROWS*T+24&&s.status==='play'){
    s.hearts--;s.ev.push('hurt');
    if(s.hearts<=0){s.status='dead';s.ev.push('dead');}
    else{p.x=s.spawn.x;p.y=s.spawn.y;p.vx=p.vy=0;p.inv=100;p.dir=1;}
  }
  for(const c of s.coins)if(!c.got&&p.x<c.x+10&&p.x+p.w>c.x&&p.y<c.y+10&&p.y+p.h>c.y){
    c.got=true;s.got++;s.score+=10;s.ev.push('coin');s.fx.push({k:'spark',x:c.x+5,y:c.y+5,t:0});}
  for(const ch of s.checks)if(!ch.on&&p.x>=ch.x*T){ch.on=true;s.spawn={x:ch.x*T+3,y:GR*T-14};s.ev.push('check');}
  if(s.status==='play'&&p.x+p.w>=s.flag*T+7){s.status='win';s.ev.push('win');}
  for(let i=s.fx.length-1;i>=0;i--)if(++s.fx[i].t>24)s.fx.splice(i,1);
}
return {T,ROWS,GR,E,GRASS,DIRT,BRICK,BONUS,USED,STONE,SPIKE,LEVELS,start,step,tile};
})();
//</core>

/* ---------- сохранение, язык ---------- */
const $=id=>document.getElementById(id);
const save=(()=>{let d={};try{d=JSON.parse(localStorage.getItem('ryzhik')||'{}');}catch(e){}
  return Object.assign({unlocked:1,best:[0,0,0],sound:true,lang:null},d);})();

/* ---------- звук ---------- */
let ac=null;
function tone(f,d,type,to,vol,delay){
  if(!save.sound)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
    const t0=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,t0);o.frequency.exponentialRampToValueAtTime(to||f,t0+d);
    g.gain.setValueAtTime(vol||0.05,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+d);
    o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+d);}catch(e){}
}
const SFX={
  jump(){tone(380,.12,'square',640);},
  coin(){tone(990,.06,'square',990);tone(1480,.1,'square',1480,.05,.06);},
  stomp(){tone(260,.12,'square',110);buzz('light');},
  bump(){tone(160,.07,'square',110);},
  heart(){tone(660,.1,'triangle',660,.08);tone(990,.16,'triangle',990,.08,.1);},
  hurt(){tone(220,.25,'sawtooth',70,.06);buzz('heavy');},
  check(){tone(520,.08,'triangle',520,.08);tone(780,.12,'triangle',780,.08,.08);},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.16,'square',f,.05,i*.12));},
  dead(){[392,330,262,196].forEach((f,i)=>tone(f,.2,'triangle',f,.07,i*.16));}
};

/* ---------- экран ---------- */
const {T,ROWS,GR}=Core,VH=ROWS*T;
const cv=$('cv'),ctx=cv.getContext('2d');
let VW=240,K=2,cam=0,S=Core.start(0),mode='menu',tick=0;
const THEMES=[
  {sky:['#6fc3ef','#d6f1f5'],far:'#9ed9b4',near:'#67b783',grass:'#4fb34a',hi:'#86dc62',dirt:'#8a5a3a',dd:'#6e452b',cloud:'#ffffff',sun:'#fff3b0'},
  {sky:['#f08a5a','#fbdba4'],far:'#cf8862',near:'#9d6054',grass:'#c9a53a',hi:'#ead065',dirt:'#7c4b3a',dd:'#5e372c',cloud:'#ffeed6',sun:'#fff0c0'},
  {sky:['#10173a','#3b3668'],far:'#2b3060',near:'#1f2449',grass:'#3f917c',hi:'#62c4a4',dirt:'#3f3759',dd:'#2c2644',cloud:'#454878',sun:'#e9edf6',stars:true}
];
function resize(){
  const W=innerWidth,H=innerHeight,fine=matchMedia('(hover:hover) and (pointer:fine)').matches;
  const land=W>H*1.15;
  document.body.classList.toggle('land',land);document.body.classList.toggle('nopad',fine);
  let scale,ch;
  if(land||fine){ch=fine&&!land?Math.min(H,W*VH/240):H;scale=ch/VH;}
  else{scale=Math.min(W/240,H*0.6/VH);ch=VH*scale;}
  $('stage').style.height=ch+'px';$('stage').style.flex=(land||fine)?'1':'none';
  VW=Math.min(480,Math.ceil(W/scale));
  K=Math.max(1,Math.min(4,Math.ceil(scale*(devicePixelRatio||1))));
  cv.width=VW*K;cv.height=VH*K;
}
const R=(c,x,y,w,h)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h);};

function drawBack(th,cx){
  const g=ctx.createLinearGradient(0,0,0,VH);g.addColorStop(0,th.sky[0]);g.addColorStop(1,th.sky[1]);
  ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);
  if(th.stars)for(let i=0;i<40;i++){const x=((i*71-cx*0.05)%(VW+8)+VW+8)%(VW+8),y=(i*53)%120;R((i+((tick/30)|0))%7?'#cfd6ff':'#ffffff',x|0,y,1,1);}
  R(th.sun,VW-52,26,18,18);R(th.sun,VW-54,28,22,14);R(th.sun,VW-50,24,14,22);
  for(let i=0;i<5;i++){const x=(((i*97-cx*0.15)%(VW+70))+VW+70)%(VW+70)-50,y=18+(i*37)%46;
    R(th.cloud,x|0,y+4,30,7);R(th.cloud,(x|0)+5,y,14,6);R(th.cloud,(x|0)+16,y+2,10,5);}
  for(let x=0;x<VW;x+=2){const wx=x+cx*0.3;const y=118+Math.sin(wx*0.021)*16+Math.sin(wx*0.057)*7;R(th.far,x,y|0,2,VH);}
  for(let x=0;x<VW;x+=2){const wx=x+cx*0.55;const y=150+Math.sin(wx*0.033+2)*12+Math.sin(wx*0.09)*5;R(th.near,x,y|0,2,VH);}
}
function drawTile(th,t,x,y,c,r){
  switch(t){
    case Core.GRASS:R(th.dirt,x,y,T,T);R(th.grass,x,y,T,5);R(th.hi,x,y,T,2);R(th.grass,x+((c*5)%11),y+5,2,2);R(th.dd,x+((c*7+3)%12),y+10,2,2);break;
    case Core.DIRT:R(th.dirt,x,y,T,T);R(th.dd,x+((c*7+r*5)%12),y+((c*3+r*7)%12),2,2);R(th.dd,x+((c*11+r*3)%13),y+((c*5+r*11)%13),2,1);break;
    case Core.BRICK:R('#c4673a',x,y,T,T);R('#e08a55',x,y,T,1);R('#8e4526',x,y+7,T,1);R('#8e4526',x,y+15,T,1);R('#8e4526',x+7,y,1,7);R('#8e4526',x+3,y+8,1,7);R('#8e4526',x+11,y+8,1,7);break;
    case Core.BONUS:R('#f2b632',x,y,T,T);R('#ffe08a',x,y,T,1);R('#ffe08a',x,y,1,T);R('#b9801a',x,y+15,T,1);R('#b9801a',x+15,y,1,T);
      {const a=((tick/20)|0)%2;R('#fff8d6',x+7,y+4+a,2,8-a*2);R('#fff8d6',x+4+a,y+7,8-a*2,2);}break;
    case Core.USED:R('#8d7b68',x,y,T,T);R('#a39280',x,y,T,1);R('#6a5a4a',x,y+15,T,1);R('#6a5a4a',x+15,y,1,T);R('#6a5a4a',x+3,y+3,2,2);R('#6a5a4a',x+11,y+11,2,2);break;
    case Core.STONE:R('#8d94a6',x,y,T,T);R('#b3b9c8',x,y,T,2);R('#666d80',x,y+14,T,2);break;
    case Core.SPIKE:ctx.fillStyle='#e3e9f0';ctx.beginPath();
      for(let i=0;i<3;i++){ctx.moveTo(x+i*5+0.5,y+T);ctx.lineTo(x+i*5+3,y+5);ctx.lineTo(x+i*5+5.5,y+T);}ctx.fill();R('#9aa4b2',x,y+14,T,2);break;
  }
}
function drawFox(p){
  if(p.inv>0&&((p.inv>>2)&1))return;
  const O='#e8792b',W='#fff3e0',D='#2b1a12',SC='#2bb3a3',air=!p.ground,f=((p.anim/7)|0)%2;
  ctx.save();ctx.translate(Math.round(p.x)+(p.dir<0?13:-3),Math.round(p.y)-2);ctx.scale(p.dir,1);
  R(O,1,air?5:7,4,4);R(W,0,air?4:6,3,3);                 // хвост
  R(O,4,8,7,5);R(W,6,11,4,2);                            // тело
  if(air){R(D,3,13,3,2);R(D,10,12,3,2);}
  else if(Math.abs(p.vx)<0.2){R(D,4,13,2,3);R(D,9,13,2,3);}
  else if(f){R(D,3,13,2,3);R(D,10,13,2,2);}else{R(D,5,13,2,2);R(D,8,13,2,3);}
  R(O,7,2,8,7);R(O,8,0,2,2);R(O,12,0,2,2);R(D,8,0,1,1);R(D,13,0,1,1);   // голова, уши
  R(W,11,6,5,3);R(D,15,6,1,1);R(D,11,4,1,2);             // мордочка, нос, глаз
  R(SC,7,9,5,1);R(SC,6,9,1,3);                           // шарф
  ctx.restore();
}
function drawEnemy(e){
  const x=Math.round(e.x),y=Math.round(e.y);
  if(e.dead){if(e.dead<20){const c=e.type==='bat'?'#3b2a4a':'#58c24a';R(c,x,y+e.h-3,12,3);}return;}
  if(e.type==='slime'){const q=((e.t/12)|0)%2;
    R('#3f9a36',x,y+4-q,12,6+q);R('#58c24a',x+1,y+1+q,10,8-q);R('#9be58c',x+2,y+2+q,4,1);
    R('#18301a',x+(e.vx<0?2:4),y+4+q,2,2);R('#18301a',x+(e.vx<0?6:8),y+4+q,2,2);}
  else if(e.type==='spiky'){
    R('#6a3aa8',x,y+4,12,6);R('#8a4fd0',x+1,y+2,10,7);
    for(let i=0;i<3;i++){R('#f4f0ff',x+1+i*4,y-1,2,3);R('#f4f0ff',x+i*4+1.5,y-2,1,1);}
    R('#fff',x+(e.vx<0?2:5),y+5,2,2);R('#fff',x+(e.vx<0?6:9),y+5,2,2);R('#201030',x+(e.vx<0?2:6),y+6,1,1);R('#201030',x+(e.vx<0?6:10),y+6,1,1);}
  else{const q=((e.t/8)|0)%2;
    R('#3b2a4a',x+4,y+1,4,6);R('#3b2a4a',x+3,y,2,2);R('#3b2a4a',x+7,y,2,2);
    if(q){R('#55406a',x,y,4,3);R('#55406a',x+8,y,4,3);}else{R('#55406a',x,y+4,4,3);R('#55406a',x+8,y+4,4,3);}
    R('#ff6b6b',x+4,y+3,1,1);R('#ff6b6b',x+7,y+3,1,1);}
}
function draw(){
  const s=S,th=THEMES[s.theme],p=s.p;
  const target=p.x+p.w/2-VW*(p.dir>0?0.38:0.6);cam+=(target-cam)*0.1;
  cam=Math.max(0,Math.min(s.w*T-VW,cam));
  const cx=Math.round(cam*K)/K;
  ctx.setTransform(K,0,0,K,0,0);
  drawBack(th,cx);
  ctx.translate(-cx,0);
  const c0=Math.max(0,Math.floor(cx/T)),c1=Math.min(s.w-1,Math.ceil((cx+VW)/T));
  for(let r=0;r<ROWS;r++)for(let c=c0;c<=c1;c++){
    const t=s.grid[r*s.w+c];if(!t)continue;let off=0;
    for(const f of s.fx)if(f.k==='bump'&&f.c===c&&f.r===r)off=-([0,2,4,4,3,2,1][f.t]||0);
    drawTile(th,t,c*T,r*T+off,c,r);
  }
  // контрольные точки и флаг
  for(const ch of s.checks){const x=ch.x*T,y=GR*T;R('#6b4a2b',x+7,y-20,2,20);R('#3b2a1a',x+4,y-27,8,8);R(ch.on?'#ffd23f':'#55606e',x+5,y-26,6,6);if(ch.on)R('#fff6c9',x+6,y-25,2,2);}
  {const x=s.flag*T,y=GR*T;R('#8d94a6',x+4,y-4,8,4);R('#e9edf6',x+7,y-84,2,80);R('#ffd23f',x+6,y-87,4,4);
   const wv=Math.sin(tick*0.12)*2;ctx.fillStyle='#f08a24';ctx.beginPath();ctx.moveTo(x+9,y-82);ctx.lineTo(x+31,y-74+wv);ctx.lineTo(x+9,y-66);ctx.fill();}
  // монеты
  const cw=[8,6,2,6][((tick/8)|0)%4];
  for(const c of s.coins)if(!c.got&&c.x>cx-16&&c.x<cx+VW+16){R('#c9951a',c.x+5-cw/2,c.y+1,cw,9);R('#ffd23f',c.x+5-cw/2,c.y,cw,9);if(cw>4)R('#fff6c9',c.x+4,c.y+2,1,4);}
  for(const e of s.en)if(e.x>cx-20&&e.x<cx+VW+20)drawEnemy(e);
  drawFox(p);
  for(const f of s.fx){
    if(f.k==='coin'){const y=f.y-Math.sin(f.t/24*Math.PI)*22;R('#c9951a',f.x,y+1,8,9);R('#ffd23f',f.x,y,8,9);}
    else if(f.k==='heart'){const y=f.y-f.t;R('#ff5a5f',f.x,y,3,3);R('#ff5a5f',f.x+4,y,3,3);R('#ff5a5f',f.x,y+2,7,3);R('#ff5a5f',f.x+1,y+5,5,1);R('#ff5a5f',f.x+2,y+6,3,1);R('#ff5a5f',f.x+3,y+7,1,1);}
    else if(f.k==='puff'){const d=f.t*0.7;for(let i=0;i<4;i++)R('#ffffff',f.x+[-1,1,-1,1][i]*d-1,f.y+[-1,-1,1,1][i]*d*0.6-1,2,2);}
    else if(f.k==='spark'){const d=f.t*0.5;R('#fff6c9',f.x-d,f.y,1,1);R('#fff6c9',f.x+d,f.y,1,1);R('#fff6c9',f.x,f.y-d,1,1);R('#fff6c9',f.x,f.y+d,1,1);}
  }
}
let hudKey='';
function hud(){
  const s=S,sec=(s.time/60)|0,key=s.hearts+'|'+s.got+'|'+sec;if(key===hudKey)return;hudKey=key;
  $('hearts').innerHTML='♥'.repeat(Math.max(0,s.hearts))+'<i>'+'♥'.repeat(3-Math.max(0,s.hearts))+'</i>';
  $('coins').textContent=s.got+'/'+s.total;$('time').textContent=fmt(sec);
}
const fmt=sec=>((sec/60)|0)+':'+String(sec%60).padStart(2,'0');

/* ---------- управление ---------- */
const kb={},tc={},inp={left:false,right:false,jump:false};
const sync=()=>{inp.left=!!(kb.left||tc.left);inp.right=!!(kb.right||tc.right);inp.jump=!!(kb.jump||tc.jump);
  $('kl').classList.toggle('on',!!tc.left);$('kr').classList.toggle('on',!!tc.right);$('kj').classList.toggle('on',!!tc.jump);};
const KEYS={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',ArrowUp:'jump',KeyW:'jump',KeyZ:'jump'};
addEventListener('keydown',e=>{
  if(KEYS[e.code]){kb[KEYS[e.code]]=true;sync();e.preventDefault();}
  else if(e.code==='Escape'||e.code==='KeyP'){if(mode==='play')pause();else if(mode==='pause')resume();}
  else if(e.code==='Enter'&&mode==='end')$('bNext').style.display==='none'?$('bAgain').click():$('bNext').click();
});
addEventListener('keyup',e=>{if(KEYS[e.code]){kb[KEYS[e.code]]=false;sync();}});
{ // крестик: одна зона на две кнопки, палец можно перекатывать с «влево» на «вправо», не отрывая
  const d=$('dpad');let id=null;
  const set=e=>{const r=d.getBoundingClientRect(),left=e.clientX-r.left<r.width/2;tc.left=left;tc.right=!left;sync();};
  d.addEventListener('pointerdown',e=>{id=e.pointerId;try{d.setPointerCapture(id);}catch(_){}set(e);e.preventDefault();});
  d.addEventListener('pointermove',e=>{if(e.pointerId===id)set(e);});
  const up=e=>{if(e.pointerId===id){id=null;tc.left=tc.right=false;sync();}};
  d.addEventListener('pointerup',up);d.addEventListener('pointercancel',up);
  const j=$('kj');let jid=null;
  j.addEventListener('pointerdown',e=>{jid=e.pointerId;try{j.setPointerCapture(jid);}catch(_){}tc.jump=true;sync();e.preventDefault();});
  const jup=e=>{if(e.pointerId===jid){jid=null;tc.jump=false;sync();}};
  j.addEventListener('pointerup',jup);j.addEventListener('pointercancel',jup);
}
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('blur',()=>{for(const k in kb)kb[k]=false;for(const k in tc)tc[k]=false;sync();});

/* ---------- экраны ---------- */
function show(id){for(const o of ['menu','pause','end'])$(o).classList.toggle('show',o===id);}
function texts(){
  L=STR[save.lang];document.documentElement.lang=save.lang;document.title=L.title;
  $('tTitle').textContent=L.title;$('tSub').textContent=L.sub;$('bSound').textContent=save.sound?L.soundOn:L.soundOff;$('bLang').textContent=L.lang;
  $('tPause').textContent=L.pause;$('bResume').textContent=L.resume;$('bRestart').textContent=L.restart;$('bMenu1').textContent=$('bMenu2').textContent=L.menu;
  $('bNext').textContent=L.next;$('bAgain').textContent=L.again;$('padhint').textContent=L.hint;
  const box=$('levels');box.innerHTML='';
  Core.LEVELS.forEach((_,i)=>{const b=document.createElement('button');b.className='lv';b.disabled=i>=save.unlocked;
    b.innerHTML='<b>'+(i+1)+'</b><span></span><small></small>';b.children[1].textContent=L.names[i];
    b.children[2].textContent=b.disabled?L.lock:(save.best[i]?L.best+' '+save.best[i]:'');
    b.onclick=()=>play(i);box.appendChild(b);});
}
function play(i){S=Core.start(i);cam=0;hudKey='';mode='play';acc=0;show(null);tone(1,.01,'sine',1,.001);}
function pause(){if(mode!=='play')return;mode='pause';show('pause');}
function resume(){mode='play';show(null);}
function menu(){mode='menu';texts();show('menu');}
function finish(){
  const s=S,win=s.status==='win',sec=(s.time/60)|0;
  let total=s.score;if(win)total+=Math.max(0,150-sec)*5+s.hearts*100;
  const rec=win&&total>(save.best[s.i]||0);
  if(win){if(rec)save.best[s.i]=total;save.unlocked=Math.max(save.unlocked,Math.min(Core.LEVELS.length,s.i+2));persist();}
  const last=s.i===Core.LEVELS.length-1;
  $('tEnd').textContent=win?(last?L.allDone:L.win):L.over;
  $('stats').innerHTML='';
  const row=(a,b)=>{const x=document.createElement('span'),y=document.createElement('b');x.textContent=a;y.textContent=b;$('stats').append(x,y);};
  row(L.coins,s.got+' / '+s.total);row(L.time,fmt(sec));if(win)row(L.score,total+(rec?'  ★':''));
  $('bNext').style.display=win&&!last?'':'none';
  mode='end';setTimeout(()=>{if(mode==='end')show('end');},win?900:700);
}
$('bPause').onclick=pause;$('bResume').onclick=resume;$('bRestart').onclick=()=>play(S.i);$('bMenu1').onclick=$('bMenu2').onclick=menu;
$('bAgain').onclick=()=>play(S.i);$('bNext').onclick=()=>play(Math.min(Core.LEVELS.length-1,S.i+1));
$('bSound').onclick=()=>{save.sound=!save.sound;persist();texts();if(save.sound)SFX.coin();};
$('bLang').onclick=()=>{save.lang=save.lang==='ru'?'en':'ru';persist();texts();};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});

/* ---------- цикл ---------- */
const STEP=1000/60;let last=0,acc=0;
function frame(t){
  requestAnimationFrame(frame);tick++;
  const dt=Math.min(100,t-last);last=t;
  if(mode==='play'){
    acc+=dt;
    while(acc>=STEP){acc-=STEP;Core.step(S,inp);for(const e of S.ev)if(SFX[e])SFX[e]();
      if(S.status!=='play'){finish();break;}}
  }else if(mode==='end'){for(let i=S.fx.length-1;i>=0;i--)if(++S.fx[i].t>24)S.fx.splice(i,1);}
  draw();hud();
}
addEventListener('resize',resize);resize();texts();requestAnimationFrame(frame);
</script>
